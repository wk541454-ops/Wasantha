name: Build Android AAB
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Force Upgrade Gradle to 8.9
        run: |
          gradle wrapper --gradle-version 8.9 --distribution-type all
          chmod +x ./gradlew

      - name: Bypass Signing Configurations completely
        run: |
          # build.gradle.kts හෝ build.gradle ලේඛන ඇතුළේ ඇති signingConfig පේළි සියල්ලම සම්පූර්ණයෙන්ම ඉවත් කරයි
          find . -name "build.gradle.kts" -o -name "build.gradle" | while read file; do
            echo "Processing $file"
            sed -i 's/signingConfig = signingConfigs.*/\/\/ signingConfig removed/g' "$file"
            sed -i 's/signingConfig signingConfigs.*/\/\/ signingConfig removed/g' "$file"
          done

      - name: Build Unsigned Release App Bundle
        run: ./gradlew :app:bundleRelease --no-daemon

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-bundle
          path: "**/build/outputs/bundle/release/*.aab"

