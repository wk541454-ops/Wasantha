name: Build Android AAB
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Force Upgrade Gradle to 8.9
        run: |
          gradle wrapper --gradle-version 8.9 --distribution-type all
          chmod +x ./gradlew

      - name: Create Missing Files (JKS & Firebase JSON)
        run: |
          # 1. ඇප් එක ඉල්ලන 'my-upload-key.jks' ලේඛනය සාදයි
          keytool -genkey -v -keystore my-upload-key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias upload -storepass mypassword -keypass mypassword -dname "CN=Wasantha, OU=Dev, O=FriendHub, L=Colombo, S=Western, C=LK"
          
          # 2. බිල්ඩ් එක නවත්වන අතුරුදන් වූ google-services.json ලේඛනය සාදයි
          mkdir -p app/src/release
          echo '{"project_info":{"project_number":"123","project_id":"dummy","storage_bucket":"://appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:123:android:123","android_client_info":{"package_name":"com.example.wasantha"}},"api_key":[{"current_key":"dummy"}],"services":{"appinvite_service":{"status":1}}}]}' > app/google-services.json
          echo '{"project_info":{"project_number":"123","project_id":"dummy","storage_bucket":"://appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:123:android:123","android_client_info":{"package_name":"com.example.wasantha"}},"api_key":[{"current_key":"dummy"}],"services":{"appinvite_service":{"status":1}}}]}' > app/src/release/google-services.json

      - name: Build Release App Bundle
        run: ./gradlew :app:bundleRelease -PSTORE_PASSWORD="mypassword" -PKEY_PASSWORD="mypassword" --no-daemon

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-bundle
          path: "**/build/outputs/bundle/release/*.aab"
