name: Build Android AAB
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Force Upgrade Gradle to 8.9
        run: |
          gradle wrapper --gradle-version 8.9 --distribution-type all
          chmod +x ./gradlew

      - name: Generate JKS in Root Directory
        run: |
          # ඇප් එකේ build.gradle.kts එකට අනුව rootDir එක ඇතුළටම 'my-upload-key.jks' නිවැරදිව සාදා දෙයි
          keytool -genkey -v -keystore my-upload-key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias upload -storepass mypassword -keypass mypassword -dname "CN=Wasantha, OU=Dev, O=FriendHub, L=Colombo, S=Western, C=LK"

      - name: Build Release App Bundle
        run: ./gradlew :app:bundleRelease -PSTORE_PASSWORD="mypassword" -PKEY_PASSWORD="mypassword" --no-daemon

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-bundle
          path: "**/build/outputs/bundle/release/*.aab"
